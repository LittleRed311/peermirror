<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cast your phone screen to any TV or monitor browser — no app install needed. Just connect with a code and share.">
  <title>CastLink — Phone to TV Screen Sharing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="glass-card fade-in">
    <div class="logo-icon">📺</div>
    <h1 class="app-title">CastLink</h1>
    <p class="app-subtitle">Share your phone screen to any TV or monitor — no app needed</p>

    <div class="divider"></div>

    <p class="section-label">I'm using a…</p>

    <div class="btn-group">
      <a href="tv.html" class="btn btn-primary" id="btn-tv">
        <span class="btn-icon">🖥️</span>
        TV / Monitor
      </a>
      <a href="phone.html" class="btn btn-secondary" id="btn-phone">
        <span class="btn-icon">📱</span>
        Phone / Tablet
      </a>
    </div>

    <div style="margin-top: 32px; text-align: center;">
      <p style="color: var(--text-muted); font-size: 0.8125rem; line-height: 1.6;">
        Open this page on both devices.<br>
        The TV generates a code. Enter it on your phone to connect.
      </p>
    </div>
  </div>
</body>
</html>
