<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CastLink — TV display. Show the code and receive a screen share.">
  <title>CastLink — TV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="index.html" class="back-link" id="back-link">← Back</a>

  <div class="container" id="waiting-screen">
    <h1>TV Display</h1>
    <p class="subtitle">Enter this code on the sender device</p>

    <div class="code-display" id="room-code-display"></div>

    <div class="status status-waiting" id="status">
      <span class="dot dot-pulse"></span>
      <span id="status-text">Waiting for sender to connect…</span>
    </div>
  </div>

  <div class="video-container" id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <div class="video-overlay">
      <button class="overlay-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
      <button class="overlay-btn" id="btn-disconnect" title="Disconnect">✕</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/tv.js"></script>
</body>
</html>
